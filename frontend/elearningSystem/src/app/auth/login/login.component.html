<div class="auth-page-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h2 class="header-title">Welcome Back!</h2>
      <p class="header-subtitle">Sign in to continue your e-learning journey.</p>
    </header>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="your.email@example.com"
          class="form-input"
          #emailField="ngModel"
          [class.is-invalid]="emailField.invalid && emailField.touched"
        />
        <div *ngIf="emailField.invalid && emailField.touched" class="validation-feedback">
          <div *ngIf="emailField.errors?.['required']">Email is required.</div>
          <div *ngIf="emailField.errors?.['email']">Please enter a valid email address.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter your password"
          class="form-input"
          #passwordField="ngModel"
          [class.is-invalid]="passwordField.invalid && passwordField.touched"
        />
        <div *ngIf="passwordField.invalid && passwordField.touched" class="validation-feedback">
          <div *ngIf="passwordField.errors?.['required']">Password is required.</div>
        </div>
      </div>

      <p *ngIf="error" class="form-message error-message">{{ error }}</p>

      <button type="submit" class="submit-button" [disabled]="loginForm.invalid || isAuthenticating">
        {{ isAuthenticating ? 'Logging In...' : 'Login' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register" class="auth-link">Register Here</a></p>
      <!-- <a routerLink="/forgot-password" class="auth-link">Forgot Password?</a> -->
    </div>
  </div>
</div>
