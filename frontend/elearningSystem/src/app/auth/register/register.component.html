<div class="auth-page-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h2 class="header-title">Join Our Community!</h2>
      <p class="header-subtitle">Create your account and start exploring our courses today.</p>
    </header>

    <form (ngSubmit)="register()" #registerForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="fullName" class="form-label">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          [(ngModel)]="fullName"
          required
          placeholder="John Doe"
          class="form-input"
          #fullNameField="ngModel"
          [class.is-invalid]="fullNameField.invalid && fullNameField.touched"
        />
        <div *ngIf="fullNameField.invalid && fullNameField.touched" class="validation-feedback">
          <div *ngIf="fullNameField.errors?.['required']">Full Name is required.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="your.email@example.com"
          class="form-input"
          #emailField="ngModel"
          [class.is-invalid]="emailField.invalid && emailField.touched"
        />
        <div *ngIf="emailField.invalid && emailField.touched" class="validation-feedback">
          <div *ngIf="emailField.errors?.['required']">Email is required.</div>
          <div *ngIf="emailField.errors?.['email']">Please enter a valid email address.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="Create a strong password (min. 6 characters)"
          class="form-input"
          #passwordField="ngModel"
          [class.is-invalid]="passwordField.invalid && passwordField.touched"
        />
        <div *ngIf="passwordField.invalid && passwordField.touched" class="validation-feedback">
          <div *ngIf="passwordField.errors?.['required']">Password is required.</div>
          <div *ngIf="passwordField.errors?.['minlength']">Password must be at least 6 characters.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="role" class="form-label">I am a...</label>
        <div class="custom-select-wrapper">
          <select
            id="role"
            name="role"
            [(ngModel)]="role"
            class="form-select"
            #roleField="ngModel"
          >
            <option value="Student">Student</option>
            <option value="Admin">Admin</option>
          </select>
          <span class="select-arrow"></span>
        </div>
      </div>

      <p *ngIf="error" class="form-message error-message">{{ error }}</p>

      <button type="submit" class="submit-button" [disabled]="registerForm.invalid || isRegistering">
        {{ isRegistering ? 'Registering...' : 'Register Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="auth-link">Login Here</a></p>
    </div>
  </div>
</div>
